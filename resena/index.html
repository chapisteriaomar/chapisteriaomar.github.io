<style>
:root{--bg:#0b0a09;--ink:#F7F6F3;--muted:#a8a39b;--red:#DD3C33;--red2:#ff5a4f;--gold:#ffc94d;--edge:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
/* aurora suave de fondo, como la intro de la web */
.aur{position:fixed;inset:-20%;filter:blur(70px) saturate(130%);pointer-events:none}
.aur i{position:absolute;border-radius:50%;opacity:.5;animation:drift 14s ease-in-out infinite alternate}
.aur i:nth-child(1){width:55vmax;height:30vmax;left:5%;top:20%;background:#DD3C33}
.aur i:nth-child(2){width:45vmax;height:26vmax;right:0;top:45%;background:#ff8a5c;animation-duration:18s;animation-delay:-4s}
.aur i:nth-child(3){width:40vmax;height:22vmax;left:30%;bottom:0;background:#7a1f1a;animation-duration:16s;animation-delay:-8s}
@keyframes drift{to{transform:translate(8vw,-6vh) rotate(25deg) scale(1.15)}}
main{position:relative;min-height:100%;display:grid;place-items:center;padding:24px}
.card{width:min(440px,100%);padding:clamp(28px,6vw,44px) clamp(22px,6vw,40px);border-radius:28px;text-align:center;background:rgba(255,255,255,.06);border:1px solid var(--edge);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.logo{width:min(220px,62vw);margin:0 auto 26px}
.k{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.k::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
h1{font:700 clamp(32px,8vw,44px)/1.02 Inter;letter-spacing:-.035em;margin-bottom:12px}
h1 em{font-style:normal;color:var(--red)}
.sub{color:var(--muted);margin-bottom:24px}
/* estrellas que se encienden una por una */
.stars{display:flex;justify-content:center;gap:8px;margin-bottom:28px}
.stars svg{width:clamp(34px,9vw,42px);height:auto;fill:rgba(255,255,255,.12);transform:scale(.6);opacity:0}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 24px;border-radius:999px;background:var(--red);color:#fff;font-weight:600;text-decoration:none;transition:background .2s,box-shadow .3s}
.go:hover{background:var(--red2);box-shadow:0 0 28px rgba(221,60,51,.55)}
.go svg{width:20px;height:20px}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--gold));transform-origin:left;transform:scaleX(0)}
.note{color:var(--muted);font-size:13px;margin-top:10px}
@media(prefers-reduced-motion:no-preference){
  .card>*{animation:blurIn .9s cubic-bezier(.2,.7,.2,1) both}
  .card>:nth-child(2){animation-delay:.08s}.card>:nth-child(3){animation-delay:.16s}.card>:nth-child(4){animation-delay:.24s}
  .card>:nth-child(5){animation-delay:.32s}.card>:nth-child(6){animation-delay:.4s}.card>:nth-child(7){animation-delay:.48s}.card>:nth-child(8){animation-delay:.56s}
  .stars svg{animation:star .5s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(.7s + var(--i) * .14s)}
  .bar i{animation:fill var(--wait) linear .4s forwards}
}
@media(prefers-reduced-motion:reduce){.stars svg{transform:none;opacity:1;fill:var(--gold)}.bar{display:none}}
@keyframes blurIn{from{opacity:0;filter:blur(12px);transform:translateY(-8px)}}
@keyframes star{to{transform:none;opacity:1;fill:var(--gold);filter:drop-shadow(0 0 10px rgba(255,201,77,.45))}}
@keyframes fill{to{transform:none}}
</style>
</head>
<body style="--wait:4s">
<div class="aur" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <section class="card">
    <img class="logo" src="/assets/logo-grande.svg" alt="Chapistería Omar Solutions">
    <span class="k">Reseñas en Google</span>
    <h1>¿Cómo te fue <em>con nosotros?</em></h1>
    <p class="sub">Tu opinión nos ayuda a seguir mejorando y a que más gente nos conozca.</p>
    <div class="stars" aria-label="5 estrellas">
      <svg viewBox="0 0 24 24" style="--i:0"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24" style="--i:1"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24" style="--i:2"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24" style="--i:3"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
      <svg viewBox="0 0 24 24" style="--i:4"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>
    </div>
    <a class="go" id="go" href="https://g.page/r/Ccjl_hJKm_rNEBM/review">Dejar mi reseña en Google
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <div class="bar" aria-hidden="true"><i></i></div>
    <p class="note" id="note">Te llevamos a Google en unos segundos…</p>
  </section>
</main>
<script>
// pasa sola a Google cuando se llena la barra
setTimeout(function () { location.replace(document.getElementById("go").href); }, 4400);
</script>
