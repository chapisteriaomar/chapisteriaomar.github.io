<style>
:root{--bg:#0b0a09;--ink:#F7F6F3;--muted:#a8a39b;--red:#DD3C33;--red2:#ff5a4f;--edge:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
/* aurora suave de fondo, como /opinion */
.aur{position:fixed;inset:-20%;filter:blur(70px) saturate(130%);pointer-events:none}
.aur i{position:absolute;border-radius:50%;opacity:.5;animation:drift 14s ease-in-out infinite alternate}
.aur i:nth-child(1){width:55vmax;height:30vmax;left:5%;top:20%;background:#DD3C33}
.aur i:nth-child(2){width:45vmax;height:26vmax;right:0;top:45%;background:#ff8a5c;animation-duration:18s;animation-delay:-4s}
.aur i:nth-child(3){width:40vmax;height:22vmax;left:30%;bottom:0;background:#7a1f1a;animation-duration:16s;animation-delay:-8s}
@keyframes drift{to{transform:translate(8vw,-6vh) rotate(25deg) scale(1.15)}}
main{position:relative;min-height:100%;display:grid;place-items:center;padding:24px}
.card{width:min(440px,100%);padding:clamp(28px,6vw,44px) clamp(22px,6vw,40px);border-radius:28px;text-align:center;background:rgba(255,255,255,.06);border:1px solid var(--edge);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.logo{width:min(220px,62vw);margin:0 auto 26px}
h1{font:700 clamp(32px,8vw,44px)/1.02 Inter;letter-spacing:-.035em;margin-bottom:18px}
/* pin que cae y rebota sobre su sombra */
.pin{position:relative;width:64px;height:84px;margin:0 auto 24px}
.pin svg{width:64px;height:auto;fill:var(--red2);filter:drop-shadow(0 0 14px rgba(255,90,79,.45));opacity:0;transform:translateY(-40px);animation:cae .7s cubic-bezier(.3,1.5,.5,1) .7s forwards}
.pin i{position:absolute;left:50%;bottom:0;width:30px;height:8px;margin-left:-15px;border-radius:50%;background:rgba(0,0,0,.45);transform:scale(.3);opacity:0;animation:sombra .7s ease .7s forwards}
.note{color:var(--muted);font-size:13px;margin-top:6px}
.note a{color:var(--ink)}
.card>*{animation:blurIn .9s cubic-bezier(.2,.7,.2,1) both}
.card>:nth-child(2){animation-delay:.08s}.card>:nth-child(3){animation-delay:.16s}.card>:nth-child(4){animation-delay:.24s}
@keyframes blurIn{from{opacity:0;filter:blur(12px);transform:translateY(-8px)}}
@keyframes cae{to{opacity:1;transform:none}}
@keyframes sombra{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.aur i,.card>*,.pin svg,.pin i{animation:none;opacity:1;transform:none;filter:none}}
</style>
</head>
<body>
<div class="aur" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <section class="card">
    <img class="logo" src="/assets/logo-grande.svg" alt="Chapistería Omar Solutions">
    <h1>Cómo llegar al taller</h1>
    <div class="pin" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 1.5a7.5 7.5 0 0 0-7.5 7.5c0 5.6 7.5 13.5 7.5 13.5s7.5-7.9 7.5-13.5A7.5 7.5 0 0 0 12 1.5zm0 10.3a2.8 2.8 0 1 1 0-5.6 2.8 2.8 0 0 1 0 5.6z"/></svg><i></i></div>
    <p class="note">Te llevamos a Google Maps…</p>
  </section>
</main>
<script>
// pasa sola a Google Maps cuando el pin terminó de caer (.7s + .7s + .3s)
setTimeout(function () { location.replace("https://desabollito-bot.desabollito.workers.dev/mapa/7"); }, 1700);
</script>
